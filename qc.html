<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QC Redirect</title>
<meta http-equiv="refresh" content="0">
</head>
<body><p>Opening source email…<br><span id="lnk"></span></p>
<script>
const id = new URLSearchParams(location.search).get('id');
if (id) {
  const url = 'https://mail.google.com/mail/u/1/#all/' + id;
  document.getElementById('lnk').innerHTML = '<a href="' + url + '" id="a">Click here if not redirected</a>';
  document.getElementById('a').click();
}
</script>
</body></html>
