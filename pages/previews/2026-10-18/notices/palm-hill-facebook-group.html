<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>main{max-width:780px;margin:0 auto;padding:16px;font:18px/1.6 Arial,Helvetica,sans-serif}.content-card{background:#fff;border:1px solid #d7d1bd;border-radius:12px;padding:16px;margin:12px 0}.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}</style>
</head><body>
<!-- ph-archive-nav:none (PREVIEW-ONLY notice Listen page for the unsent Oct 18, 2026 draft; not linked from any archive) -->
<main><div class="hd"><h1 class="ph-section" style="margin:0">Palm Hill Facebook Group</h1><a class="ph-listen" href="#" style="display:inline-flex;align-items:center;gap:6px;margin-left:auto;background:none;border:0;padding:0;color:#1d4310;font:bold 18px/1.5 Arial,Helvetica,sans-serif;text-decoration:underline;text-underline-offset:3px;white-space:nowrap"><img src="https://palmhillnews.vercel.app/assets/images/phnews/2026-10-04/speaker-read-aloud-green-gold-512-v3.png" alt="" width="32" height="32" style="display:inline-block;width:32px;height:32px;border:0;margin:0;vertical-align:middle">Listen</a></div>
<div class="content-card"><p>[PLACEHOLDER — Tony Ciaramitaro&#x27;s Facebook promotion wording arrives Friday, Oct 16 in palmhillblast. Paste his text here before the proof.]</p></div>
<p class="source" style="font-size:14px;color:#666">Source: Tony Ciaramitaro, Communications Chair (pending)</p>
</main>
<!-- ph-page-listen:start -->
<script>
(() => {
  const link = document.querySelector('a.ph-listen');
  if (!link) return;
  const label = Array.from(link.childNodes).find((n) => n.nodeType === 3 && n.textContent.trim());
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    return;
  }
  const synth = window.speechSynthesis;
  const MON = {Jan:'January',Feb:'February',Mar:'March',Apr:'April',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};
  let run = 0, playing = false, started = false;
  const setLabel = (t) => { if (label) label.textContent = t; link.setAttribute('aria-label', t === 'Stop' ? 'Stop reading' : 'Listen to this page'); };
  function chunks(text) {
    const clean = text.replace(/\b(Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b\.?/g, (m, k) => MON[k]).replace(/\s+/g, ' ').trim();
    if (!clean) return [];
    const frags = typeof Intl.Segmenter === 'function'
      ? Array.from(new Intl.Segmenter('en-US', {granularity: 'sentence'}).segment(clean), (s) => s.segment.trim()).filter(Boolean)
      : [clean];
    const out = []; let p = '';
    for (const s of frags) { if (p && p.length + s.length + 1 > 260) { out.push(p); p = s; } else p += (p ? ' ' : '') + s; }
    if (p) out.push(p);
    return out;
  }
  function parts() {
    const h1 = document.querySelector('h1');
    const blocks = Array.from(document.querySelectorAll('main .content-card'))
      .filter((el) => !el.classList.contains('attachments') && !el.querySelector('p.source, .source'))
      .map((el) => el.innerText.trim())
      .filter(Boolean);
    return [h1 ? h1.textContent : '', ...blocks].flatMap(chunks);
  }
  function stop() { run += 1; playing = false; synth.cancel(); setLabel('Listen'); }
  function start(auto) {
    const list = parts(); const me = ++run; let i = 0;
    synth.cancel(); playing = true; started = false; setLabel('Stop');
    const next = () => {
      if (me !== run) return;
      if (i >= list.length) { playing = false; setLabel('Listen'); return; }
      const u = new SpeechSynthesisUtterance(list[i]);
      u.lang = 'en-US'; u.rate = 1;
      u.onstart = () => { if (me === run) started = true; };
      u.onend = () => { if (me !== run) return; i += 1; next(); };
      u.onerror = (e) => { if (me !== run || e.error === 'canceled' || e.error === 'interrupted') return; stop(); };
      synth.speak(u);
    };
    next();
    if (auto) window.setTimeout(() => { if (me === run && playing && !started) { stop(); arm(); } }, 4000);
  }
  link.addEventListener('click', (e) => { e.preventDefault(); if (playing) stop(); else start(false); });
  function arm() {
    const onTap = (e) => {
      document.removeEventListener('click', onTap, true);
      if (playing || (e.target.closest && e.target.closest('a'))) return;
      start(false);
    };
    document.addEventListener('click', onTap, true);
  }
  window.addEventListener('pagehide', stop);
  const q = new URLSearchParams(location.search);
  if (q.get('listen') === '1' || q.get('autoplay') === '1') {
    const go = () => start(true);
    if (document.readyState === 'complete') window.setTimeout(go, 0); else window.addEventListener('load', go, {once: true});
  }
})();
</script>
<!-- ph-page-listen:end -->
</body></html>
