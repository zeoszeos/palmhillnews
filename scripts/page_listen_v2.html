<!-- ph-page-listen:start -->
<script data-ph-listen-v="2">
(() => {
  // STYLE-RULES R49 / R49b / R76 / R119: v2 page-listen.
  // Desktop, opened with ?listen=1, ?autoplay=1, or data-ph-autoplay: try to read once on load. If that start is
  // blocked (no 'start' within 1.5 s) a big "Tap to listen" bar appears. Never a silent wait.
  // iPhone/iPad (R119): iOS will not speak without a tap on THIS page. Do not start on load (that set playing while
  // started stayed false, and the first Listen tap was treated as Stop). Show "Tap to listen" immediately. Listen
  // stops only after speech has actually begun (playing && started).
/*READER*/
  window.phListenParts = phParts;
  const link = document.querySelector('a.ph-listen');
  if (!link) return;
  const label = Array.from(link.childNodes).find((n) => n.nodeType === 3 && n.textContent.trim());
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
  const synth = window.speechSynthesis;
  let run = 0, playing = false, started = false, bar = null;
  function iphoneOrIpad() {
    const ua = navigator.userAgent || '';
    if (/iP(hone|ad|od)/.test(ua)) return true;
    return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  }
  const setLabel = (t) => { if (label) label.textContent = t; link.setAttribute('aria-label', t === 'Stop' ? 'Stop reading' : 'Listen to this page'); };
  function hideBar() { if (bar) { bar.remove(); bar = null; document.body.style.paddingTop = ''; } }
  function showBar() {
    if (bar) return;
    bar = document.createElement('button');
    bar.type = 'button'; bar.className = 'ph-tap-bar'; bar.setAttribute('aria-label', 'Tap to listen to this page');
    bar.textContent = '\u25B6 Tap to listen';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;display:block;width:100%;box-sizing:border-box;margin:0;min-height:80px;padding:20px 16px;border:0;border-bottom:4px solid #e0b300;background:#1d4310;color:#ffffff;font:bold 30px/1.2 Arial,Helvetica,sans-serif;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none';
    bar.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); firstOff(); hideBar(); start(false); });
    document.body.insertBefore(bar, document.body.firstChild);
    window.scrollTo(0, 0);
    document.body.style.paddingTop = '88px';
  }
  function stop() { run += 1; playing = false; synth.cancel(); setLabel('Listen'); }
  function start(auto) {
    hideBar();
    const list = phParts(document); const me = ++run; let i = 0;
    synth.cancel(); playing = true; started = false; setLabel('Stop');
    const next = () => {
      if (me !== run) return;
      if (i >= list.length) { playing = false; setLabel('Listen'); return; }
      const u = new SpeechSynthesisUtterance(list[i]);
      u.lang = 'en-US'; u.rate = 1;
      u.onstart = () => { if (me === run) started = true; };
      u.onend = () => { if (me !== run) return; started = true; i += 1; next(); };
      u.onerror = (e) => { if (me !== run || e.error === 'canceled' || e.error === 'interrupted') return; stop(); if (auto && !started) showBar(); };
      synth.speak(u);
    };
    next();
    if (auto) window.setTimeout(() => { if (me === run && playing && !started) { stop(); showBar(); } }, 1500);
  }
  // R94 (Steven, Oct 30 2026 4:02 PM): opened from the email (?listen=1), the first tap / key anywhere on the page starts
  // the read once (a browser only allows speech after a user gesture on this page), not only the Tap to listen bar.
  // Links and buttons keep their own action. Scroll is not a user gesture for speech, so it is not used.
  const FIRST = ['pointerdown', 'touchstart', 'keydown'];
  const firstOff = () => FIRST.forEach((t) => document.removeEventListener(t, onFirst, true));
  function onFirst(e) {
    if (e.target && e.target.closest && e.target.closest('a,button,input,select,textarea')) return;
    firstOff();
    if (playing && started) return;
    start(false);
  }
  // R119: Stop only after speech has actually begun. A blocked auto-start leaves playing true and started false;
  // that first Listen tap must Start, not Stop. Once speech is talking, Listen still stops it.
  link.addEventListener('click', (e) => { e.preventDefault(); firstOff(); if (playing && started) stop(); else start(false); });
  window.addEventListener('pagehide', stop);
  const q = new URLSearchParams(location.search);
  const auto = q.get('autoplay') !== '0' && (q.get('listen') === '1' || q.get('autoplay') === '1' || document.body.dataset.phAutoplay === '1');
  if (auto) {
    FIRST.forEach((t) => document.addEventListener(t, onFirst, {capture: true, passive: true}));
    // R119: iPhone/iPad show Tap to listen immediately and wait for a tap on this page.
    // Desktop still auto-starts on load when the browser allows it.
    if (iphoneOrIpad()) showBar();
    else {
      const go = () => start(true);
      if (document.readyState === 'complete') window.setTimeout(go, 0); else window.addEventListener('load', go, {once: true});
    }
  }
})();
</script>
<!-- ph-page-listen:end -->
