<script data-ph-listen-v="2">
(() => {
  // STYLE-RULES R76 (Steven, Oct 25 2026 9:29 AM): website Listen buttons read IN PLACE -- tap Listen, the item is read
  // aloud on this page (button turns to Stop); tap Stop to end. The link stays a normal link: no speech support, a
  // different site, or any load problem -> it opens the listen page as before. Never added to the emailed SEND copy.
  // R116 (Steven, Nov 6 2026): a Committee Chair Report Listen is a dedicated listen-*.html page (no ?listen=1 and no
  // ph-listen class). The first tap matches the word Listen, then this script rewrites that word to Stop. Stop is the
  // same control, so the second tap must be caught here and must not follow the href.
/*READER*/
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
  const synth = window.speechSynthesis;
  const isListen = (a) => {
    if (a.classList.contains('ph-listen') || a.classList.contains('ph-playing') || a.getAttribute('aria-pressed') === 'true') return true;
    if (/[?&]listen=1\b/.test(a.getAttribute('href') || '')) return true;
    const word = /^\s*(?:\uD83D\uDD0A\s*)?(Listen|Stop)\s*\u2192?\s*$/.exec(a.textContent);
    if (!word) return false;
    return word[1] === 'Listen' || a.dataset.phLabel !== undefined;  // R116: Stop still names this control
  };
  let cur = null, run = 0;
  function textNode(a) { return Array.from(a.childNodes).reverse().find((n) => n.nodeType === 3 && n.textContent.trim()); }
  function setState(a, on) {
    const n = textNode(a);
    if (on) { a.dataset.phLabel = n ? n.textContent : ''; if (n) n.textContent = n.textContent.replace(/Listen/, 'Stop'); a.setAttribute('aria-pressed', 'true'); a.classList.add('ph-playing'); a.style.outline = '3px solid #e0b300'; }
    else { if (n && a.dataset.phLabel !== undefined) n.textContent = a.dataset.phLabel; a.removeAttribute('aria-pressed'); a.classList.remove('ph-playing'); a.style.outline = ''; }
  }
  function stop() { run += 1; synth.cancel(); if (cur) setState(cur, false); cur = null; const f = document.getElementById('ph-inplace-frame'); if (f) f.remove(); }
  function target(a) {
    try {
      const u = new URL(a.href, location.href);
      if (!/^https?:$/.test(u.protocol)) return null;
      if (u.origin !== location.origin) { if (!/(^|\.)palmhillnews\.vercel\.app$/.test(u.hostname)) return null; }
      const v = new URL(location.origin + u.pathname); v.searchParams.set('autoplay', '0'); return v.href;
    } catch (e) { return null; }
  }
  function play(a, url) {
    stop(); const me = ++run; cur = a; setState(a, true);
    const unlock = new SpeechSynthesisUtterance(' '); unlock.volume = 0; synth.speak(unlock);  // inside the tap (iPhone needs this)
    const f = document.createElement('iframe'); f.id = 'ph-inplace-frame'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.style.cssText = 'position:absolute;left:-10000px;top:0;width:420px;height:900px;border:0;opacity:0;pointer-events:none';
    const fail = () => { if (me !== run) return; stop(); location.href = a.href; };
    const timer = setTimeout(fail, 8000);
    f.onload = () => {
      clearTimeout(timer); if (me !== run) return;
      let list = [];
      try { list = phParts(f.contentDocument); } catch (e) { return fail(); }
      if (!list.length) return fail();
      let i = 0;
      const next = () => {
        if (me !== run) return;
        if (i >= list.length) { stop(); return; }
        const u = new SpeechSynthesisUtterance(list[i]); u.lang = 'en-US'; u.rate = 1;
        u.onend = () => { if (me !== run) return; i += 1; next(); };
        u.onerror = (e) => { if (me !== run || e.error === 'canceled' || e.error === 'interrupted') return; stop(); };
        synth.speak(u);
      };
      next();
    };
    f.src = url; document.body.appendChild(f);
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    // R116: Stop is this same control (the label no longer says Listen). Catch it before the browser follows the href.
    if (a === cur || a.classList.contains('ph-playing')) { e.preventDefault(); stop(); return; }
    if (!isListen(a)) return;
    const url = target(a); if (!url) return;  // not ours, or file://: normal link
    e.preventDefault(); play(a, url);
  }, true);
  window.addEventListener('pagehide', stop);
})();
</script>
<!-- ph-inplace-listen:end -->
